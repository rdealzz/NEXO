name: Despachar avisos do NEXO

# O cron do Vercel no plano Hobby só aceita uma execução por dia, e um dia é
# tempo demais para um produto que promete avisar "10 minutos antes". Então o
# despachante de verdade roda aqui, de graça, a cada 10 minutos. O cron do
# vercel.json fica como rede de segurança diária.
#
# Precisa de dois secrets no repositório:
#   NEXO_URL     — https://seu-app.vercel.app
#   CRON_SECRET  — o mesmo valor configurado nas variáveis do Vercel
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  despachar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/dispatch
        env:
          NEXO_URL: ${{ secrets.NEXO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$NEXO_URL" ]; then
            echo "NEXO_URL não configurado — nada a fazer."
            exit 0
          fi
          resposta=$(curl -sS --fail-with-body --max-time 60 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$NEXO_URL/api/cron/dispatch")
          echo "$resposta"
