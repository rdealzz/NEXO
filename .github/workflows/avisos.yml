name: Despachar avisos do NEXO

# Rede de segurança, não o despachante principal.
#
# Quem roda a cada minuto é o pg_cron do Postgres (supabase/migrations/
# 0005_cron_por_minuto.sql) — é o único agendador de graça que chega nessa
# frequência, e "avisar 10 minutos antes" exige isso. O GitHub Actions não desce
# de 5 minutos, e o cron da Vercel no plano Hobby aceita uma vez por dia; os
# dois ficam aqui para o caso de o banco não estar com o pg_cron ligado.
#
# Nada se perde com a sobreposição: o despachante só lê avisos ainda não
# enviados e marca cada um ao entregar, então rodar duas vezes no mesmo minuto
# não manda o aviso duas vezes.
#
# Precisa de dois secrets no repositório:
#   NEXO_URL     — https://seu-app.vercel.app
#   CRON_SECRET  — o mesmo valor configurado nas variáveis do Vercel
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  despachar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/dispatch
        env:
          NEXO_URL: ${{ secrets.NEXO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$NEXO_URL" ]; then
            echo "NEXO_URL não configurado — nada a fazer."
            exit 0
          fi
          resposta=$(curl -sS --fail-with-body --max-time 60 \
            -H "authorization: Bearer $CRON_SECRET" \
            "$NEXO_URL/api/cron/dispatch")
          echo "$resposta"
