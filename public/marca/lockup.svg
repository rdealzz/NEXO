<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 260" role="img" aria-label="NEXO">
  <title>NEXO</title>
  <g transform="translate(0 -14) scale(0.56)">
  
  <defs>
    <linearGradient id="nx-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7fecc0"/>
      <stop offset="0.5" stop-color="#2e9d74"/>
      <stop offset="1" stop-color="#14684b"/>
    </linearGradient>
    <linearGradient id="nx-luz" x1="0.15" y1="0" x2="0.5" y2="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="nx-sino" d="M256 108c-70 0-118 52-118 140 0 56-10 106-34 136-9 11-1 28 14 28h276c15 0 23-17 14-28-24-30-34-80-34-136 0-88-48-140-118-140z"/>
    <path id="nx-badalo" d="M216 412h80c0 25-18 44-40 44s-40-19-40-44z"/>
    <clipPath id="nx-recorte"><use href="#nx-sino"/></clipPath>
  </defs>

  <!-- Espessura: sutil, só o suficiente para a peça ter chão. -->
  <g fill="#11543d" opacity="0.55" transform="translate(0 12)">
    <use href="#nx-sino"/>
    <use href="#nx-badalo"/>
  </g>

  <g fill="url(#nx-face)">
    <circle cx="256" cy="86" r="26"/>
    <use href="#nx-sino"/>
    <use href="#nx-badalo"/>
  </g>

  <g clip-path="url(#nx-recorte)">
    <rect width="512" height="512" fill="url(#nx-luz)"/>
  </g>

  <path d="M208 336V216l96 102V216" fill="none" stroke="#fbfefc" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>
  <g transform="translate(340 30)" fill="none" stroke="#14503a" stroke-width="22"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 140V60l68 80V60"/>
    <path d="M121 60v80M121 60h65M121 100h55M121 140h65"/>
    <path d="M228 60l68 80M296 60l-68 80"/>
    <circle cx="383" cy="100" r="44"/>
  </g>
</svg>
